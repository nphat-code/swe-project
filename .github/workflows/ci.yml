name: BrewLite CI Pipeline (Sprint 1 Quality Gate)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (NestJS + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint Quality Check
        run: npm run lint

      - name: Static TypeCheck
        run: npm run typecheck

      - name: Run Backend Unit Tests & Coverage
        run: npm run test:cov

      - name: Build Backend Production Artifact
        run: npm run build

  frontend-ci:
    name: Frontend CI (Next.js App Router)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Quality Check
        run: npm run lint

      - name: Static TypeCheck
        run: npm run typecheck

      - name: Run Frontend Unit Tests & Coverage
        run: npm run test -- --ci --coverage

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.brewlite.nphat.dev
